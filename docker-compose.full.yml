# Sfumato Autonomous SOC — FULL mode overlay: adds OpenCTI Community Edition (6.9.9) and its dependencies.
#   docker compose -f docker-compose.yml -f docker-compose.full.yml up -d --build
# Requirements: ~12-16 GB RAM free for Elasticsearch + OpenCTI. First start takes several minutes.
# Required in .env: OPENCTI_ADMIN_PASSWORD, OPENCTI_ADMIN_TOKEN (UUIDv4), OPENCTI_ENCRYPTION_KEY,
#                   OPENCTI_HEALTH_KEY, MINIO_ROOT_PASSWORD, RABBITMQ_DEFAULT_PASS,
#                   CONNECTOR_MITRE_ID, CONNECTOR_CISA_KEV_ID (UUIDv4) — start.sh / start.ps1 generate them.

x-opencti-env: &opencti-env
  OPENCTI_URL: http://opencti:8080
  OPENCTI_TOKEN: ${OPENCTI_ADMIN_TOKEN:?OPENCTI_ADMIN_TOKEN must be set for FULL mode}

services:
  api:
    environment:
      DEPLOYMENT_MODE: full
      OPENCTI_URL: http://opencti:8080
      OPENCTI_TOKEN: ${OPENCTI_ADMIN_TOKEN:?OPENCTI_ADMIN_TOKEN must be set for FULL mode}

  worker:
    environment:
      DEPLOYMENT_MODE: full
      OPENCTI_URL: http://opencti:8080
      OPENCTI_TOKEN: ${OPENCTI_ADMIN_TOKEN:?OPENCTI_ADMIN_TOKEN must be set for FULL mode}

  octi-redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - octi-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.0
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.ml.enabled: "false"
      xpack.security.enabled: "false"
      thread_pool.search.queue_size: "5000"
      logger.org.elasticsearch.discovery: ERROR
      ES_JAVA_OPTS: -Xms${ELASTIC_MEMORY_SIZE:-2G} -Xmx${ELASTIC_MEMORY_SIZE:-2G}
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ulimits:
      memlock: {soft: -1, hard: -1}
      nofile: {soft: 65536, hard: 65536}
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -vq '\"status\":\"red\"'"]
      interval: 10s
      timeout: 5s
      retries: 50

  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z  # community MinIO build used by OpenCTI
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-opencti}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set for FULL mode}
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.1-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-opencti}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS must be set for FULL mode}
      RABBITMQ_NODENAME: rabbit01@localhost
    volumes:
      - amqpdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 30s
      retries: 5

  opencti:
    image: opencti/platform:${OPENCTI_VERSION:-6.9.9}
    restart: unless-stopped
    environment:
      NODE_OPTIONS: --max-old-space-size=8096
      APP__PORT: 8080
      APP__BASE_URL: http://localhost:8080
      APP__ADMIN__EMAIL: ${OPENCTI_ADMIN_EMAIL:-admin@sfumato.local}
      APP__ADMIN__PASSWORD: ${OPENCTI_ADMIN_PASSWORD:?OPENCTI_ADMIN_PASSWORD must be set for FULL mode}
      APP__ADMIN__TOKEN: ${OPENCTI_ADMIN_TOKEN:?OPENCTI_ADMIN_TOKEN must be set for FULL mode}
      APP__ENCRYPTION_KEY: ${OPENCTI_ENCRYPTION_KEY:?OPENCTI_ENCRYPTION_KEY must be set for FULL mode}
      APP__APP_LOGS__LOGS_LEVEL: error
      APP__HEALTH_ACCESS_KEY: ${OPENCTI_HEALTH_KEY:?OPENCTI_HEALTH_KEY must be set for FULL mode}
      REDIS__HOSTNAME: octi-redis
      REDIS__PORT: 6379
      ELASTICSEARCH__URL: http://elasticsearch:9200
      ELASTICSEARCH__NUMBER_OF_REPLICAS: 0
      MINIO__ENDPOINT: minio
      MINIO__PORT: 9000
      MINIO__USE_SSL: "false"
      MINIO__ACCESS_KEY: ${MINIO_ROOT_USER:-opencti}
      MINIO__SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      RABBITMQ__HOSTNAME: rabbitmq
      RABBITMQ__PORT: 5672
      RABBITMQ__PORT_MANAGEMENT: 15672
      RABBITMQ__MANAGEMENT_SSL: "false"
      RABBITMQ__USERNAME: ${RABBITMQ_DEFAULT_USER:-opencti}
      RABBITMQ__PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      SMTP__HOSTNAME: localhost
      SMTP__PORT: 25
      PROVIDERS__LOCAL__STRATEGY: LocalStrategy
    ports:
      - "8080:8080"
    depends_on:
      octi-redis: {condition: service_healthy}
      elasticsearch: {condition: service_healthy}
      minio: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://opencti:8080/health?health_access_key=${OPENCTI_HEALTH_KEY}"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s

  opencti-worker:
    image: opencti/worker:${OPENCTI_VERSION:-6.9.9}
    restart: unless-stopped
    environment:
      <<: *opencti-env
      WORKER_LOG_LEVEL: info
    depends_on:
      opencti: {condition: service_healthy}
    deploy:
      replicas: 2

  connector-mitre:
    image: opencti/connector-mitre:${OPENCTI_VERSION:-6.9.9}
    restart: unless-stopped
    environment:
      <<: *opencti-env
      CONNECTOR_ID: ${CONNECTOR_MITRE_ID:?CONNECTOR_MITRE_ID must be set for FULL mode}
      CONNECTOR_NAME: MITRE ATT&CK
      CONNECTOR_SCOPE: tool,report,malware,identity,campaign,intrusion-set,attack-pattern,course-of-action,x-mitre-data-source,x-mitre-data-component,x-mitre-matrix,x-mitre-tactic,x-mitre-collection
      CONNECTOR_LOG_LEVEL: error
      MITRE_INTERVAL: 7
    depends_on:
      opencti: {condition: service_healthy}

  connector-cisa-kev:
    image: opencti/connector-cisa-known-exploited-vulnerabilities:${OPENCTI_VERSION:-6.9.9}
    restart: unless-stopped
    environment:
      <<: *opencti-env
      CONNECTOR_ID: ${CONNECTOR_CISA_KEV_ID:?CONNECTOR_CISA_KEV_ID must be set for FULL mode}
      CONNECTOR_NAME: CISA Known Exploited Vulnerabilities
      CONNECTOR_SCOPE: cisa
      CONNECTOR_LOG_LEVEL: error
    depends_on:
      opencti: {condition: service_healthy}

volumes:
  esdata:
  s3data:
  amqpdata:
  octi-redisdata:
